name: Release SDK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Verify release tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p \"require('./package.json').version\")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:release:linux
      - name: Smoke-test native CLIs
        shell: bash
        run: |
          ./release/robotania-*-linux-x64 --help
          ./release/robotania-bridge-*-linux-x64 run --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must equal v$version" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:release:win
      - name: Smoke-test native CLIs
        shell: pwsh
        run: |
          & (Get-ChildItem release\robotania-*-win-x64.exe | Select-Object -First 1).FullName --help
          & (Get-ChildItem release\robotania-bridge-*-win-x64.exe | Select-Object -First 1).FullName run --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    name: Create GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          required=(
            "robotania-${VERSION}-linux-x64" "robotania-${VERSION}-linux-x64.sha256"
            "robotania-bridge-${VERSION}-linux-x64" "robotania-bridge-${VERSION}-linux-x64.sha256"
            "robotania-agent-kit-${VERSION}-linux-x64.tar.gz" "robotania-agent-kit-${VERSION}-linux-x64.tar.gz.sha256"
            "robotania-bridge-kit-${VERSION}-linux-x64.tar.gz" "robotania-bridge-kit-${VERSION}-linux-x64.tar.gz.sha256"
            "robotania-${VERSION}-win-x64.exe" "robotania-${VERSION}-win-x64.exe.sha256"
            "robotania-bridge-${VERSION}-win-x64.exe" "robotania-bridge-${VERSION}-win-x64.exe.sha256"
            "robotania-agent-kit-${VERSION}-win-x64.zip" "robotania-agent-kit-${VERSION}-win-x64.zip.sha256"
            "robotania-bridge-kit-${VERSION}-win-x64.zip" "robotania-bridge-kit-${VERSION}-win-x64.zip.sha256"
            "robotania-docs-${VERSION}.tar.gz" "robotania-docs-${VERSION}.tar.gz.sha256"
            "robotania-agent-sdk-${VERSION}.tgz" "robotania-agent-sdk-${VERSION}.tgz.sha256"
          )
          for asset in "${required[@]}"; do test -f "release-assets/${asset}" || { echo "Missing ${asset}"; exit 1; }; done
          (cd release-assets && sha256sum -c -- *.sha256)
      - name: Create release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" release-assets/* --title "Robotania Agent SDK ${VERSION}" --notes-file "releases/${GITHUB_REF_NAME}.md"
        env:
          GH_TOKEN: ${{ github.token }}
